# Builds src/ into dist/ (content-hashed file names, see build.mjs) and publishes it to GitHub Pages.
# Two jobs, as in GitHub's starter workflow: deploy-pages run in the same job right after the upload
# sometimes finds no "github-pages" artifact (actions/deploy-pages#451; both sites, 2026-11-23).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: node build.mjs
      - name: Inject analytics script
        if: vars.TIDESIGHT_URL != '' && vars.TIDESIGHT_SITE_ID != ''
        env:
          ANALYTICS_URL: ${{ vars.TIDESIGHT_URL }}
          ANALYTICS_SITE: ${{ vars.TIDESIGHT_SITE_ID }}
        run: |
          python3 -c '
          import os, pathlib
          url, site = os.environ["ANALYTICS_URL"], os.environ["ANALYTICS_SITE"]
          tag = f"  <script async src=\"{url}\" data-site=\"{site}\"></script>\n"
          p = pathlib.Path("dist/index.html")
          html = p.read_text(encoding="utf-8")
          if url not in html:
              p.write_text(html.replace("</head>", tag + "</head>", 1), encoding="utf-8")
          '
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
